name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # Supersede stale runs for the same pull request, but give every merge commit
  # on main its own group so that post-merge validation is never cancelled.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-and-package:
    name: Verify and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Validate Marketplace listing assets
        run: npm run validate:listing-assets

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Chrome Web Store listing assets
        run: npm run store:validate

      - name: Validate Stream Deck plugin
        run: npm run validate

      - name: Pack installable artifacts
        run: npm run pack

      - name: Verify packaged artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          plugin="artifacts/dev.annonator.meet-deck.streamDeckPlugin"
          extension="artifacts/meet-deck-chrome-v${version}.zip"

          test -f "$plugin"
          test -f "$extension"
          test -f artifacts/SHA256SUMS.txt
          (
            cd artifacts
            sha256sum -c SHA256SUMS.txt
            unzip -tqq "meet-deck-chrome-v${version}.zip"
            entries="$(unzip -Z1 "meet-deck-chrome-v${version}.zip")"
            expected_entries=(
              "LICENSE"
              "THIRD_PARTY_NOTICES"
              "_locales/de/messages.json"
              "_locales/en/messages.json"
              "content-script.js"
              "icons/icon-128.png"
              "icons/icon-16.png"
              "icons/icon-32.png"
              "icons/icon-48.png"
              "manifest.json"
              "onboarding.css"
              "onboarding.html"
              "onboarding.js"
              "popup.css"
              "popup.html"
              "popup.js"
              "service-worker.js"
            )
            diff -u \
              <(printf '%s\n' "${expected_entries[@]}") \
              <(printf '%s\n' "$entries" | LC_ALL=C sort)
            grep -Fxq "manifest.json" <<< "$entries"
            grep -Fxq "_locales/en/messages.json" <<< "$entries"
            grep -Fxq "_locales/de/messages.json" <<< "$entries"
            test "$(grep -c '^_locales/' <<< "$entries")" = "2"
            if grep -Eq '(^|/)(node_modules|\.DS_Store)(/|$)|\.map$|^\.\./|^/' <<< "$entries"; then
              echo "Chrome artifact contains a forbidden entry" >&2
              exit 1
            fi
            test "$(wc -l < SHA256SUMS.txt | tr -d ' ')" = "2"
            test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          )

      - name: Upload installable artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meet-deck-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
