name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build and verify release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        id: source
        shell: bash
        run: |
          set -euo pipefail
          main_ref="refs/remotes/origin/main"
          tag_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"

          if ! git show-ref --verify --quiet "$main_ref"; then
            echo "The checkout does not contain origin/main." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "$main_ref"; then
            echo "Release tag ${GITHUB_REF_NAME} points to a commit that is not on main." >&2
            exit 1
          fi
          echo "sha=${tag_commit}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Verify tag and release metadata
        run: npm run release:verify -- "${GITHUB_REF_NAME}"

      - name: Install exact dependencies
        run: npm ci

      - name: Run release gates
        run: npm run check

      - name: Pack installable artifacts
        run: npm run pack

      - name: Verify release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          plugin="artifacts/dev.annonator.meet-deck.streamDeckPlugin"
          extension="artifacts/meet-deck-chrome-v${version}.zip"

          test -f "$plugin"
          test -f "$extension"
          test -f artifacts/SHA256SUMS.txt
          (
            cd artifacts
            sha256sum -c SHA256SUMS.txt
            unzip -tqq "meet-deck-chrome-v${version}.zip"
            entries="$(unzip -Z1 "meet-deck-chrome-v${version}.zip")"
            expected_entries=(
              "LICENSE"
              "THIRD_PARTY_NOTICES"
              "_locales/de/messages.json"
              "_locales/en/messages.json"
              "content-script.js"
              "icons/icon-128.png"
              "icons/icon-16.png"
              "icons/icon-32.png"
              "icons/icon-48.png"
              "manifest.json"
              "onboarding.css"
              "onboarding.html"
              "onboarding.js"
              "popup.css"
              "popup.html"
              "popup.js"
              "service-worker.js"
            )
            diff -u \
              <(printf '%s\n' "${expected_entries[@]}") \
              <(printf '%s\n' "$entries" | LC_ALL=C sort)
            grep -Fxq "manifest.json" <<< "$entries"
            grep -Fxq "_locales/en/messages.json" <<< "$entries"
            grep -Fxq "_locales/de/messages.json" <<< "$entries"
            test "$(grep -c '^_locales/' <<< "$entries")" = "2"
            if grep -Eq '(^|/)(node_modules|\.DS_Store)(/|$)|\.map$|^\.\./|^/' <<< "$entries"; then
              echo "Chrome artifact contains a forbidden entry" >&2
              exit 1
            fi
            test "$(wc -l < SHA256SUMS.txt | tr -d ' ')" = "2"
            test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          )

      - name: Upload workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: meet-deck-${{ github.ref_name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

  publish-release:
    name: Publish GitHub release
    needs: build-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Verify release tag has not moved
        env:
          BUILT_SOURCE_SHA: ${{ needs.build-release.outputs.source-sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          remote_source_sha="$(gh api "repos/${GH_REPO}/commits/${GITHUB_REF_NAME}" --jq .sha)"
          if [ "$remote_source_sha" != "$BUILT_SOURCE_SHA" ]; then
            echo "Release tag ${GITHUB_REF_NAME} moved after the build started." >&2
            exit 1
          fi

      - name: Download verified release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: meet-deck-${{ github.ref_name }}
          path: artifacts
          digest-mismatch: error

      - name: Reverify release artifacts and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          plugin="artifacts/dev.annonator.meet-deck.streamDeckPlugin"
          extension="artifacts/meet-deck-chrome-v${version}.zip"

          test -f "$plugin"
          test -f "$extension"
          test -f artifacts/SHA256SUMS.txt
          (
            cd artifacts
            sha256sum -c SHA256SUMS.txt
            test "$(wc -l < SHA256SUMS.txt | tr -d ' ')" = "2"
            test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          )

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/dev.annonator.meet-deck.streamDeckPlugin
          "artifacts/meet-deck-chrome-${GITHUB_REF_NAME}.zip" artifacts/SHA256SUMS.txt --verify-tag
          --fail-on-no-commits --generate-notes --title "Meet Deck ${GITHUB_REF_NAME}"
